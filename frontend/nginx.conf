server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # React Router için SPA (Single Page Application) yönlendirmesi
    # Bulunamayan her rota için index.html döndür
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statik dosyalar için cache ayarları (Performans için)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
