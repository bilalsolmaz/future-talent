version: '3.8'

services:
  db:
    image: postgres:17
    container_name: localshop_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-localshop_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localshop123}
      POSTGRES_DB: ${POSTGRES_DB:-localshop}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - localshop_network

  # Redis — cache, session, kuyruk, rate limiting için
  # Production'da da aynı yapı: şifre korumalı, dışarıya kapalı
  redis:
    image: redis:7-alpine
    container_name: localshop_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-localshop_redis_123} --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - localshop_network

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: localshop_backend
    restart: always
    depends_on:
      - db
      - redis
    volumes:
      - ./backend/static:/app/static
    environment:
      # Veritabanı URL'si container ismine (db) göre ayarlandı
      DATABASE_URL: postgresql://${POSTGRES_USER:-localshop_user}:${POSTGRES_PASSWORD:-localshop123}@db:5432/${POSTGRES_DB:-localshop}
      # Redis — container ismi "redis", şifre .env'den
      REDIS_URL: redis://:${REDIS_PASSWORD:-localshop_redis_123}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-super-secret-key-for-production-needs-to-be-strong}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # Containerlar arası iletişim olduğu için CORS'ta sitenin asıl adresi olmalı.
      # Şimdilik her şeye açık (development/test için), canlıya alınca düzeltilir
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
    ports:
      - "8000:8000"
    networks:
      - localshop_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: localshop_frontend
    restart: always
    depends_on:
      - backend
    networks:
      - localshop_network

  # Ana Yönlendirici (Reverse Proxy)
  proxy:
    image: nginx:alpine
    container_name: localshop_proxy
    restart: always
    ports:
      - "8090:80"
      # İleride SSL (HTTPS) için 443 portu açılacak
      # - "443:443" 
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - localshop_network

networks:
  localshop_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
