version: '3.8'

services:
  db:
    image: postgres:17
    container_name: localshop_db
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-localshop_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localshop123}
      POSTGRES_DB: ${POSTGRES_DB:-localshop}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - localshop_network

  redis:
    image: redis:7-alpine
    container_name: localshop_redis
    restart: "no"
    command: redis-server --requirepass ${REDIS_PASSWORD:-localshop_redis_123} --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - localshop_network

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: localshop_backend
    restart: "no"
    depends_on:
      - db
      - redis
    volumes:
      - ./backend/static:/app/static
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-localshop_user}:${POSTGRES_PASSWORD:-localshop123}@db:5432/${POSTGRES_DB:-localshop}
      REDIS_URL: redis://:${REDIS_PASSWORD:-localshop_redis_123}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-super-secret-key-for-production-needs-to-be-strong}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
    ports:
      - "8000:8000"
    networks:
      - localshop_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: localshop_frontend
    restart: "no"
    depends_on:
      - backend
    networks:
      - localshop_network

  proxy:
    image: nginx:alpine
    container_name: localshop_proxy
    restart: "no"
    ports:
      - "8090:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - localshop_network

networks:
  localshop_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: