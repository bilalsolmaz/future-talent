server {
    listen 80;
    server_name _; # Tüm domainleri veya IP'leri kabul et

    # Docker iç DNS — container adlarını her zaman dinamik olarak çöz.
    # Bu olmadan nginx, başlangıçta IP'yi cache'ler ve container restart olunca 502 verir.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Güvenlik başlıkları
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # Backend API isteklerini FastAPI container'ına yönlendir
    # ÖNEMLİ: proxy_pass sonunda '/' olmamalı — nginx /api/ prefix'ini koruyarak backend'e iletir.
    # Örnek: GET /api/v1/urunler → backend:8000/api/v1/urunler (doğru)
    # Yanlış olurdu: proxy_pass .../api/ → GET /api/api/v1/urunler (çift prefix)
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Swagger dokümantasyonu — backend'in /api/docs adresine yönlendir
    location /api/docs {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }

    location /api/openapi.json {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }

    # Kalan tüm istekleri Frontend container'ına (React Nginx'i) yönlendir
    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
